name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: asan-ubsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DEXCHANGE_SANITIZE=ON
          - name: tsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DEXCHANGE_TSAN=ON
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # TSan cannot map its shadow memory with the runner's default ASLR entropy.
      - name: Reduce ASLR entropy for TSan
        if: matrix.name == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DEXCHANGE_BUILD_BENCHMARKS=OFF ${{ matrix.flags }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run example
        run: ./build/basic_usage > /dev/null
